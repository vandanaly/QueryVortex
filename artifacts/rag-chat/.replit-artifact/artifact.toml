kind = "web"
previewPath = "/"
title = "RAG Chat"
version = "1.0.0"
id = "artifacts/rag-chat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20418

[services.development]
run = "pnpm --filter @workspace/rag-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rag-chat", "run", "build" ]
serve = "static"
publicDir = "artifacts/rag-chat/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20418"
BASE_PATH = "/"
